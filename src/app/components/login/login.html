<div style="height: 100vh; width: 100vw; display: flex; flex-direction: column; justify-content: center; align-items: center;">
  <div class="card">
    <div class="card-body" style="padding: 3rem;  display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 1rem;">
      <h3>Iniciar sesión</h3>
      <input #login class="form-control" placeholder="Registro" type="text">
      <input #pass class="form-control" placeholder="Contraseña" type="password">
      <button (click)="sendlogin(login.value, pass.value)" class="btn btn-primary" [disabled]="false">Enviar</button>
    </div>
  </div>
</div>

<i (click)="toggleExpanded()" class="bi bi-view-stacked"></i>
@if (expanded) {
  <div class="card" style="position: absolute; right: 1rem; width: 20rem; max-height: 70vh; overflow-y: auto; z-index: 1000;" [style.top]="navbar.app.platform === 'android' ? '6rem' : '3rem' ">
    <div class="list-group list-group-flush">
        @if (submissions.length == 0) {
          <a class="list-group-item">No hay inscripciones recientes.</a>
        }
        @for (submission of submissions; track $index) {
          <div class="list-group-item list-group-item-action d-flex flex-column gap-1">
            <div>
              <i class="bi bi-plus-square"></i>
              <a> {{submission.details}}</a>
            </div>
            <div style="font-size: smaller;">{{submission.timestamp}}</div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div style="display: flex; align-items: left; flex-direction: row;">
                <div style="font-size: x-small; border-radius: 1rem; border: 1px solid lightgrey; width: fit-content;" [style.backgroundColor]="getStatusColor(submission.status)">
                  &nbsp;<i class="{{getStatusIcon(submission.status)}}">&nbsp;</i>{{translateStatus(submission.status)}}&nbsp;
                </div>
                <a style="font-size: x-small;">&nbsp;&nbsp;{{submission.errortext}}</a>
              </div>
              @if (submission.refreshing) {
                <div class="spinner-border spinner-border-sm" role="status" style="width: 1rem; height: 1rem;"></div>
              } @else {
                <i (click)="refreshSubmission($index)" class="bi bi-arrow-counterclockwise" style="cursor: pointer;"></i>
              }
            </div>
          </div>
        }
    </div>
  </div>
}

<div style="font-family: Inter, sans-serif; background-color:#f8fafc; margin:0; color:#1e293b; display:flex; flex-direction:column; height:100vh;">
  <div style="display:flex; justify-content:space-between; align-items:center; padding:1rem 2rem; background-color:white; border-bottom:1px solid #e2e8f0;">
    <h1 style="font-size:1.5rem; color:#0f172a; margin:0;">Inscripción UAGRM</h1>
    <div style="display: flex; gap: 3rem;">
      <app-transactionhistory></app-transactionhistory>
      <i class="bi bi-box-arrow-right" (click)="logout()"></i>
    </div>
  </div>
  <div style="display:flex; flex:1; padding:1.5rem; gap:2rem; flex-direction: row; flex-wrap: wrap;">
    <div style="flex:1; background-color:white; border-radius:1rem; box-shadow:0 2px 6px rgba(0,0,0,0.05); padding:1rem; overflow-y:auto; min-width: 20rem;">
      <app-groupselection></app-groupselection>
    </div>
    <div style="flex:1.2; background-color:white; border-radius:1rem; box-shadow:0 2px 6px rgba(0,0,0,0.05); padding:1rem 1.5rem; display:flex; flex-direction:column; justify-content:space-between;">
      <app-schedule></app-schedule>
    </div>
  </div>
</div>
